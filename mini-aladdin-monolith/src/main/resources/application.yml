# ─────────────────────────────────────────────
# Mini Aladdin — Unified Configuration
# ─────────────────────────────────────────────
spring:
  application:
    name: mini-aladdin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # JPA / Hibernate
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false

# JWT
app:
  jwt:
    secret: ${JWT_SECRET:defaultDevSecretKeyThatIsAtLeast256BitsLong!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Actuator (health endpoint for UptimeRobot)
management:
  endpoints:
    web:
      exposure:
        include: health
