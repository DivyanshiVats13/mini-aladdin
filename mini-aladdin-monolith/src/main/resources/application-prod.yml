# ─────────────────────────────────────────────
# Mini Aladdin — PROD Profile (Neon PostgreSQL)
# ─────────────────────────────────────────────
server:
  port: ${PORT:10000}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 60000
      idle-timeout: 300000
      max-lifetime: 600000
      # Do NOT crash app if DB is unreachable at startup
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Prevent Hibernate from querying DB metadata eagerly at startup
        temp:
          use_jdbc_metadata_defaults: false
    # Do NOT try to init the datasource before app is ready
    defer-datasource-initialization: false

  # Disable SQL init scripts (we let Hibernate ddl-auto handle schema)
  sql:
    init:
      mode: never

logging:
  level:
    com.minialaddin: INFO
    org.springframework.security: WARN
    com.zaxxer.hikari: INFO
    org.postgresql: WARN
