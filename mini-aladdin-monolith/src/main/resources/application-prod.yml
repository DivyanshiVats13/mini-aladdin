# ─────────────────────────────────────────────
# Mini Aladdin — PROD Profile (Neon PostgreSQL)
# ─────────────────────────────────────────────
server:
  port: ${PORT:10000}

spring:
  # ── Lazy-init: start the web port BEFORE touching the DB ──
  main:
    lazy-initialization: true

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 60000
      idle-timeout: 300000
      max-lifetime: 600000
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      # update: auto-create/update tables on startup
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        temp:
          use_jdbc_metadata_defaults: false
    defer-datasource-initialization: false
    open-in-view: false

  sql:
    init:
      mode: never

  flyway:
    enabled: false
  liquibase:
    enabled: false

# ── CORS: allow Vercel frontend ──
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── Disable DB health check so /actuator/health works without DB ──
management:
  health:
    db:
      enabled: false

logging:
  level:
    com.minialaddin: INFO
    org.springframework.security: WARN
    com.zaxxer.hikari: INFO
    org.postgresql: WARN
