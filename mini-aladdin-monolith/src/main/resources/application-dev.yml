# ─────────────────────────────────────────────
# Mini Aladdin — DEV Profile (H2 In-Memory)
# ─────────────────────────────────────────────
server:
  port: 8080

spring:
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:h2:mem:minialaddin_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.minialaddin: DEBUG
    org.springframework.security: DEBUG
