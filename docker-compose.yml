version: '3.9'

services:
  # ─────────────────────────────────────────────────
  # PostgreSQL 16 (local dev parity with Neon prod)
  # ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: minialaddin-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_aladdin_db}
      POSTGRES_USER: ${POSTGRES_USER:-aladdin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aladdin_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aladdin}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
