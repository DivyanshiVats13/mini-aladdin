# ─────────────────────────────────────────────
# Auth Service — Default / Common Configuration
# ─────────────────────────────────────────────
spring:
  application:
    name: auth-service
  profiles:
    active: dev

  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false

# JWT
app:
  jwt:
    secret: ${JWT_SECRET:defaultDevSecretKeyThatIsAtLeast256BitsLong!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
