# ─────────────────────────────────────────────
# Rebalance Engine — Default Configuration
# ─────────────────────────────────────────────
spring:
  application:
    name: rebalance-engine
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Inter-service URLs
app:
  services:
    portfolio-url: ${PORTFOLIO_SERVICE_URL:http://localhost:8082}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
